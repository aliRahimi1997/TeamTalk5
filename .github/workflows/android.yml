name: Android

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    if: "!startsWith(github.head_ref, 'debug') || startsWith(github.head_ref, 'debug-android')"
    permissions:
      security-events: write
      packages: read

    runs-on: ubuntu-26.04
    name: Android
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29
        add-to-path: false

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        validate-wrappers: true

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Update Ubuntu repository
      run: sudo apt-get update

    - name: Print env
      run: printenv | sort

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "teamtalk.keystore"
        encodedString: ${{ secrets.KEYSTORE_BASE64 }}

    - name: Build and Sign TeamTalk Android APK
      working-directory: ${{github.workspace}}/Client/TeamTalkAndroid
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Upload TeamTalk Android APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: teamtalk-android-apk
        path: ${{github.workspace}}/Client/TeamTalkAndroid/build/outputs/apk/**/*.apk

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java-kotlin"